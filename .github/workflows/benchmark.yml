
name: Benchmark Deportivo Semanal

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scraping:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: Ejecutar benchmark
        run: |
          mkdir -p resultados
          python scraper.py

      - name: Verificar resultados
        run: |
          echo "Contenido de resultados/:"
          ls -la resultados/
          echo ""
          echo "Archivos CSV encontrados:"
          find resultados/ -name "*.csv" -o -name "*.json" | head -20

      - name: Guardar resultados en el repositorio
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add resultados/ || true
          if git diff --staged --quiet; then
            echo "No hay cambios nuevos para guardar"
          else
            git commit -m "Benchmark automático - $(date +'%d/%m/%Y')"
            git push
            echo "Resultados guardados exitosamente"
          fi

